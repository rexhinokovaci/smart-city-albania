name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *" # daily OSM refresh, 06:15 Tirana (summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pull cameras from OpenStreetMap
        id: osm
        continue-on-error: true # never block a deploy on an Overpass outage
        run: npm run sync:osm
      - name: Commit if changed
        if: steps.osm.outcome == 'success'
        run: |
          if git diff --quiet -- data/osm.geojson; then echo "No OSM changes"; exit 0; fi
          git config user.name "smart-city-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.geojson
          git commit -m "data: daily OpenStreetMap sync"
          git push

  deploy:
    needs: sync
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://rexhinokovaci.github.io/smart-city-albania' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
