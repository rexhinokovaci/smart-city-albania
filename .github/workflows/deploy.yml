name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *" # daily OSM refresh, 06:15 Tirana (summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pull cameras from OpenStreetMap
        id: osm
        continue-on-error: true # never block a deploy on an Overpass outage
        run: npm run sync:osm
      - name: Pull cameras from official public sources
        continue-on-error: true
        run: npm run sync:official
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/osm.geojson data/official.geojson; then echo "No data changes"; exit 0; fi
          npm run validate
          git config user.name "smart-city-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.geojson data/official.geojson
          git commit -m "data: daily sync (OpenStreetMap + official sources)"
          git push

  deploy:
    needs: sync
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://rexhinokovaci.github.io/smart-city-albania' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Notify search engines (IndexNow → Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        env:
          SITE: https://rexhinokovaci.github.io/smart-city-albania
          KEY: fd506901871ce8ad313045e4aae8915c
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" '{host:"rexhinokovaci.github.io", key:$key, keyLocation:$loc, urlList:$urls}')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"

  # Comment on and close report issues whose camera is now on the map.
  close-reports:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - run: |
          for n in $(node scripts/close-imported.mjs); do
            state=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo MISSING)
            [ "$state" = "OPEN" ] || continue
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "📍 Kamera u shtua në hartë si **e paverifikuar**. Faleminderit! Një mirëmbajtës mund ta konfirmojë me etiketën \`approved\`. / Added to the map as unverified, thank you!"
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label added --remove-label needs-review || true
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --reason completed
          done
